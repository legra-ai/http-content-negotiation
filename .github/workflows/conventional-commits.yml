name: Conventional Commits
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  pull-requests: read
jobs:
  title:
    name: Conventional Commit
    runs-on: ubuntu-24.04
    steps:
      - uses: legra-ai/github-actions/.github/actions/conventional-commit@cf631c4de1faa1b0635d6dae2211c952d736e3c7
